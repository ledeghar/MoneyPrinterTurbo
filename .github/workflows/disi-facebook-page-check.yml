name: DISI - Check Facebook Page connection (no uploads)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-medianews-facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Meta Page validator with mocked responses
        run: python -m unittest discover -s tests -p test_mn_facebook_page_check.py -v
      - name: Verify configured Page Access Token
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
        run: python scripts/mn_facebook_page_check.py

# No scheduled or public posting. No external writes.
