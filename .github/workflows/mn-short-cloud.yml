name: MN Short - Cloud bilingual video test (manual only)

on:
  workflow_dispatch:
    inputs:
      upload_youtube_unlisted:
        description: 'Upload ONE Spanish video directly to YouTube as unlisted (OAuth)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mn-short-cloud
  cancel-in-progress: false

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check required credentials without exposing them
        run: |
          python - <<'PY'
          import os, sys
          missing = [name for name in ('GEMINI_API_KEY','PEXELS_API_KEY') if not os.environ.get(name)]
          if missing:
              sys.exit('Missing repository Actions secrets: ' + ', '.join(missing))
          print('Required generation credentials present')
          PY

      - name: Select current news item and prepare ES + EN scripts
        run: python scripts/mn_short_cloud.py prepare

      - name: Install MoneyPrinterTurbo in GitHub runner
        run: uv sync --frozen --no-dev

      - name: Configure ephemeral video-material credentials
        run: python scripts/mn_short_cloud.py configure

      - name: Render two vertical videos with music, narration and subtitles
        run: uv run --no-sync python cli.py --batch-file ./mn_short_tasks.json --stop-at video

      - name: Give exports human-readable names
        run: python scripts/mn_short_cloud.py collect

      - name: Save finished MP4 files for editorial review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MNShort-${{ github.run_number }}-ES-EN
          path: mn-short-output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Optional DIRECT YouTube upload (one Spanish Short, UNLISTED)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_youtube_unlisted == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MNSHORT_UPLOAD_UNLISTED: 'true'
        run: uv run --no-sync python scripts/mn_short_youtube_direct.py

# SAFETY: NO SCHEDULE during pilot testing. Only an explicit manual
# workflow_dispatch with upload_youtube_unlisted=true uploads ONE ES Short
# directly to YouTube as UNLISTED. This never publishes publicly.
# unverified news or unreviewed images until editorial checks and YouTube
# OAuth/upload permissions have been tested. A daily schedule will be added
# only after the full workflow has been successfully tested and approved.
