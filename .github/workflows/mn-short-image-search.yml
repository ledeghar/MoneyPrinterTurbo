name: MN Short - Exact-person image search pilot

on:
  workflow_dispatch:
    inputs:
      person:
        description: 'Exact subject name, e.g. Jensen Huang'
        required: true
        type: string
        default: 'Jensen Huang'
      context:
        description: 'Company or event for disambiguation'
        required: false
        type: string
        default: 'Nvidia'

permissions:
  contents: read

jobs:
  discover-image-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUBJECT: ${{ inputs.person }}
      CONTEXT: ${{ inputs.context }}
    steps:
      - name: Check out MN Short code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free DDGS search library
        run: python -m pip install --disable-pip-version-check "ddgs>=9,<12"
      - name: Search photo candidates by exact subject name
        run: python scripts/mn_short_image_search.py --subject "$SUBJECT" --context "$CONTEXT"
      - name: Download image research report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MNShort-Image-Research-${{ github.run_number }}
          path: image-search-results/
          if-no-files-found: warn
          retention-days: 3

# This pilot searches ONLY. It does not copy images into videos or publish them.
# Search results are not proof of identity, licensing, or right to reuse.
