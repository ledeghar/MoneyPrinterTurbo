name: MN Short - Dynamic editorial image search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-image-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out MN Short
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DDGS (web image search; no extra credentials)
        run: python -m pip install --disable-pip-version-check "ddgs>=9,<12"
      - name: Select a fresh news item and identify named subjects
        run: python scripts/mn_short_cloud.py prepare
      - name: Search by the subjects of this specific news item
        run: python scripts/mn_short_image_search.py --editorial mn_short_editorial.json
      - name: Save editorial image search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MNShort-VisualResearch-${{ github.run_number }}
          path: image-search-results/
          if-no-files-found: warn
          retention-days: 3

# No fixed protagonist, person, or company. Fresh news is selected at run time.
# Research only: the candidates are not yet cleared to be included in videos.
