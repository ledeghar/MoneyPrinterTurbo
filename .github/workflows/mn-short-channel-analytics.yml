name: MN Short - Daily YouTube views and earnings

on:
  workflow_dispatch:
  schedule:
    - cron: '10 22 * * *'
      timezone: 'Europe/Madrid'

permissions:
  contents: read

concurrency:
  group: mn-short-channel-analytics
  cancel-in-progress: true

jobs:
  channel-report:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MNSHORT_ANALYTICS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP library
        run: python -m pip install --disable-pip-version-check requests
      - name: Query YouTube analytics (read-only, not YouTube uploads)
        run: python scripts/mn_short_channel_analytics.py
      - name: Save independent revenue and view reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MNShort-Analytics-${{ github.run_number }}
          path: mn-short-analytics/
          if-no-files-found: warn
          retention-days: 30

# No traffic/revenue can be read until the channel owner authorizes OAuth.
# Requires YOUTUBE_ANALYTICS_REFRESH_TOKEN with youtube.readonly,
# yt-analytics.readonly, yt-analytics-monetary.readonly scopes.
# MNSHORT_ANALYTICS_ENABLED=true enables the DAILY report; manual dispatch
# is available for one-off tests once those secrets are configured.
