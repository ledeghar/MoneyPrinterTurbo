name: DISI - Free Claude Code programmer pilot (patch artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disi-fcc-programmer
  cancel-in-progress: false

jobs:
  produce-reviewable-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      MODEL: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      HOST: 127.0.0.1
      FCC_OPEN_BROWSER: 'false'
      MESSAGING_PLATFORM: none
      PROXY_AUTH_ENABLED: 'true'
      ENABLE_WEB_SERVER_TOOLS: 'false'
      LOG_RAW_API_PAYLOADS: 'false'
      LOG_RAW_SSE_EVENTS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm free provider credential is configured
        run: |
          test -n "$NVIDIA_NIM_API_KEY" || { echo 'Missing free NVIDIA key'; exit 1; }
      - name: Use ephemeral localhost proxy authentication
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "ANTHROPIC_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - name: Install FCC Python and agent gateway
        run: |
          uv python install 3.14.10
          uv tool install --python 3.14.10 free-claude-code==6.19.4
          fcc-server --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Agent edits a temporary checkout
        shell: bash
        run: |
          mkdir -p fcc-programmer-output
          PROMPT="$(cat .github/fcc/visual-research-programmer.md)"
          timeout 840s fcc-claude \
            --print \
            --permission-mode acceptEdits \
            --tools 'Read,Edit,Write,Grep,Glob' \
            --allowedTools 'Read,Edit,Write,Grep,Glob' \
            --max-turns 36 \
            "$PROMPT" > fcc-programmer-output/agent-report.md
      - name: Enforce edited file allowlist and save diff
        if: always()
        shell: bash
        run: |
          mkdir -p fcc-programmer-output
          git diff --binary > fcc-programmer-output/agent.patch
          git diff --name-only > fcc-programmer-output/modified-files.txt
          if [ -n "$(git ls-files --others --exclude-standard | grep -v '^fcc-programmer-output/' || true)" ]; then
            echo "Agent created unexpected untracked files. Rejecting." | tee -a fcc-programmer-output/validation.txt
            exit 1
          fi
          if grep -vE '^(scripts/mn_short_image_search.py|test/services/test_mn_short_image_search.py)$' fcc-programmer-output/modified-files.txt | grep -q .; then
            echo "Agent modified disallowed files. Rejecting." | tee -a fcc-programmer-output/validation.txt
            exit 1
          fi
          if [ ! -s fcc-programmer-output/agent.patch ]; then
            echo "Agent generated no tracked code modifications" | tee -a fcc-programmer-output/validation.txt
            exit 1
          fi
          echo 'Changes limited to allowed files. No GitHub write performed.' | tee -a fcc-programmer-output/validation.txt
      - name: Test produced code using free local pytest
        if: success()
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest test/services/test_mn_short_image_search.py -q 2>&1 | tee fcc-programmer-output/pytest.txt
      - name: Save agent report, patch and test results for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DISI-FCC-Programmer-${{ github.run_number }}
          path: fcc-programmer-output/
          if-no-files-found: warn
          retention-days: 3

# Agents cannot push, create PRs, deploy or publish. Patch is an artifact.
# Human review is required to apply any proposed diff to the repository.
