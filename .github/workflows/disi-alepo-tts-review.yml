name: DISI Alepo - Pelayo y 10 voces (solo prueba)
on:
  push:
    branches: [disi-alepo-tts-review-20261111]
    paths:
      - scripts/disi_alepo_voice_pilot.py
      - .github/workflows/disi-alepo-tts-review.yml
  pull_request:
    paths:
      - scripts/disi_alepo_voice_pilot.py
      - .github/workflows/disi-alepo-tts-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Edge neural voices
        run: python -m pip install --disable-pip-version-check edge-tts==7.3.1
      - name: Narrate review in Pelayo Spanish and 9 translations
        run: python scripts/disi_alepo_voice_pilot.py
      - name: Verify 10 nonempty real audio files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('alepo-tts-output')
          m=json.loads((p/'manifest.json').read_text())
          completed=m['completed']
          assert len(completed)>=1, m
          for k in completed:
              f=p/completed[k]['file']
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nokey=1:noprint_wrappers=1',str(f)]))
              assert 18 < d < 75, (k,d)
              completed[k]['duration_s']=round(d,3)
          (p/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DISI-ALEPO-10-VOICE-TEST
          path: alepo-tts-output/
          if-no-files-found: error
          retention-days: 3
